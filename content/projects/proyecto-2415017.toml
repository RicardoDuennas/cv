description_es = "El repique de un antiguo teléfono público sorprende a los transeúntes del centro a su paso por la calle 11. Su origen es una cabina amarilla, un equipamiento urbano común en la ciudad de Bogotá durante los años ochenta. Al levantar el auricular nos sorprende escuchar la voz alterada de Alfonso Reyes Echandía, presidente de la Corte Suprema de Justicia, quien murió durante la toma armada del Palacio de Justicia por parte del M-19, en noviembre de 1985. En dicha grabación, Reyes Echandía urge al presidente a declarar un cese al fuego, antes de ser interrumpido por el líder guerrillero Alfonso Jacquim, que lanza una amenaza al gobierno en medio del sonido de las balas. A través de este dispositivo, Guzmán transporta al espectador al momento histórico de la toma guerrillera. *Proyecto 2415017* relata la historia política de la toma, ocurrida a pocas cuadras del lugar donde el espectador escucha la voz del magistrado colombiano."
description_en = "The ring of an old public telephone surprises passers-by downtown as they walk along 11th Street. It comes from a yellow booth, a common piece of street furniture in Bogotá during the 1980s. Picking up the receiver, we are startled to hear the distorted voice of Alfonso Reyes Echandía, president of the Supreme Court of Justice, who died during the M-19's armed siege of the Palace of Justice in November 1985. In the recording, Reyes Echandía urges the president to declare a ceasefire before being interrupted by guerrilla leader Alfonso Jacquim, who threatens the government amid the sound of gunfire. Through this device, Guzmán takes the viewer back to the historic moment of the siege. *Proyecto 2415017* tells the political story of the siege, which took place a few blocks from where the viewer hears the magistrate's voice."
