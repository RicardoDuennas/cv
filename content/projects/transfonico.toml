description_es = "Transfónico es un traje transmisor FM de baja potencia que transmite paisajes sonoros y sonidos, integrando al traje los componentes necesarios para emitir (antena, transmisor y mezclador). En su uso el traje se convierte en una estación de radio independiente que posibilita a quien lo use buscar la tranquilidad y la calma a través del sonido y, al mismo tiempo, compartir esa calma con los demás: aquellos que tengan receptores de radio o teléfonos móviles con radio circundantes al traje."
description_en = "Transfónico is a low-power FM transmitter suit that broadcasts soundscapes and sounds, integrating the components needed to transmit (antenna, transmitter and mixer). When worn, the suit becomes an independent radio station that lets its wearer seek calm and tranquility through sound while sharing that calm with others: anyone nearby with a radio receiver or a phone with FM radio."
