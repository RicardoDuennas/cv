description_es = "eV-2020 es un entorno virtual sonoro para la interacción con materiales de audio producidos por estudiantes de colegios distritales de Bogotá en desarrollo de actividades del programa Crea de Idartes. Fue presentado en el Festival de la diversidad Crea Idartes 2020 y en el Salón de Arte Crea 2020. Acércate a los objetos 3D suspendidos y persigue las esferas para escuchar los sonidos."
description_en = "eV-2020 is a virtual sound environment for interacting with audio material produced by students from Bogotá public schools within Idartes' Crea program. It was presented at the 2020 Crea Idartes Diversity Festival and the 2020 Crea Art Salon. Approach the floating 3D objects and chase the spheres to hear the sounds."
