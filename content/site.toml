profile_title_en = "Profile"
profile_es = """
Soy ingeniero electrónico apasionado por la tecnología como catalizador de las interacciones pedagógicas y vehículo de experimentación creativa. Tengo amplio conocimiento de Unity, programación para las artes y desarrollo de entornos de interacción. Mi experiencia en pedagogía y artes electrónicas me ha permitido colaborar en proyectos transdisciplinares que fusionan el arte y la tecnología, creando experiencias únicas e innovadoras.

Me enfoco en poner en diálogo diversas disciplinas al servicio de la creación artística y la pedagogía de las artes. Me apasiona el papel que la tecnología desempeña en las formas de crear y experimentar y el rol de las agrupaciones como agentes de cambio social.
"""
profile_en = """
I am an electronics engineer passionate about technology as a catalyst for educational interactions and a vehicle for creative experimentation. I have extensive knowledge of Unity, programming for the arts and the development of interactive environments. My experience in education and electronic arts has allowed me to collaborate on transdisciplinary projects that merge art and technology, creating unique and innovative experiences.

I focus on bringing diverse disciplines into dialogue in the service of artistic creation and arts education. I am passionate about the role technology plays in the ways we create and experience, and about the role of collectives as agents of social change.
"""

